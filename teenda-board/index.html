<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>てえんだ 無言メッセージボード</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --panel: #17171c;
      --panel-2: #22222a;
      --text: #fff;
      --muted: #aaaab5;
      --line: rgba(255,255,255,.1);
      --accent: #ffd54a;
      --danger: #ff5b64;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      overscroll-behavior: none;
    }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    [hidden] { display: none !important; }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% -20%, rgba(255,213,74,.14), transparent 38%),
        var(--bg);
    }

    /* 選択画面 */
    .picker {
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(var(--safe-top) + 12px) calc(var(--safe-right) + 12px) calc(var(--safe-bottom) + 18px) calc(var(--safe-left) + 12px);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .brand { min-width: 0; }
    .brand h1 { margin: 0; font-size: 18px; line-height: 1.25; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .quiet-button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.055);
      border-radius: 999px;
      min-height: 36px;
      padding: 0 13px;
      font-weight: 700;
      font-size: 13px;
      flex: 0 0 auto;
    }
    .quiet-button[aria-pressed="true"] { background: #fff; color: #111; }

    .notice {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line);
      font-size: 13px;
      color: #e7e7ed;
      margin-bottom: 12px;
    }
    .notice strong { color: var(--accent); }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      position: sticky;
      top: calc(var(--safe-top) + 6px);
      z-index: 10;
      padding: 6px;
      margin: 0 -2px 12px;
      background: rgba(10,10,12,.9);
      backdrop-filter: blur(14px);
      border-radius: 14px;
    }
    .tab {
      min-width: 0;
      min-height: 40px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      font-size: 13px;
      padding: 5px 4px;
    }
    .tab.active { background: var(--panel-2); color: #fff; }

    .message-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .message-card {
      position: relative;
      min-width: 0;
    }
    .message-button {
      width: 100%;
      min-height: 84px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035));
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
      padding: 12px 10px;
      font-weight: 900;
      font-size: 16px;
      line-height: 1.35;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .message-button:active { transform: scale(.975); }
    .message-card[data-effect="celebrate"] .message-button,
    .message-card[data-effect="win"] .message-button {
      border-color: rgba(255,213,74,.45);
      background: linear-gradient(180deg, rgba(255,213,74,.19), rgba(255,125,25,.08));
    }
    .message-card[data-effect="heat"] .message-button,
    .message-card[data-effect="urge"] .message-button {
      border-color: rgba(255,91,100,.4);
      background: linear-gradient(180deg, rgba(255,91,100,.16), rgba(255,255,255,.03));
    }
    .message-card[data-category="visit"] .message-button {
      border-color: rgba(111,207,151,.35);
      background: linear-gradient(180deg, rgba(111,207,151,.13), rgba(255,255,255,.03));
    }
    .edit-actions {
      display: none;
      position: absolute;
      top: 5px;
      right: 5px;
      gap: 4px;
    }
    .editing .message-card.custom .edit-actions { display: flex; }
    .mini-action {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.78);
      font-weight: 900;
      display: grid;
      place-items: center;
      padding: 0;
    }
    .mini-action.delete { color: #ff8e94; }

    .add-button {
      width: 100%;
      min-height: 50px;
      border-radius: 15px;
      border: 1px dashed rgba(255,255,255,.25);
      color: #e9e9ef;
      background: rgba(255,255,255,.035);
      margin-top: 12px;
      font-weight: 900;
    }

    /* 見せる画面 */
    .display {
      position: fixed;
      inset: 0;
      z-index: 100;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: #050506;
      overflow: hidden;
      isolation: isolate;
    }
    .display::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.04), transparent 56%);
    }
    .display[data-effect="heat"]::before {
      background: radial-gradient(circle at 50% 48%, rgba(255,25,35,.38), rgba(78,0,4,.26) 45%, #050506 78%);
      animation: heatPulse 1s ease-in-out 3;
    }
    .display[data-effect="celebrate"]::before,
    .display[data-effect="win"]::before {
      background: radial-gradient(circle at 50% 44%, rgba(255,198,24,.26), rgba(75,38,0,.14) 46%, #050506 78%);
    }
    .display[data-effect="sad"]::before {
      background: linear-gradient(180deg, #10131b, #020203);
    }

    .message-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        calc(var(--safe-top) + clamp(22px, 5vh, 52px))
        calc(var(--safe-right) + clamp(18px, 5vw, 42px))
        calc(var(--safe-bottom) + clamp(32px, 8vh, 72px))
        calc(var(--safe-left) + clamp(18px, 5vw, 42px));
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }
    .message-stage::-webkit-scrollbar { display: none; }
    .display-text {
      width: 100%;
      max-width: 100%;
      margin: auto 0;
      color: #fff;
      font-weight: 1000;
      font-size: 64px;
      line-height: 1.14;
      letter-spacing: .01em;
      text-align: center;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-break: strict;
      text-wrap: balance;
      text-shadow:
        0 3px 0 rgba(0,0,0,.95),
        3px 0 0 rgba(0,0,0,.7),
        -3px 0 0 rgba(0,0,0,.7),
        0 -3px 0 rgba(0,0,0,.7),
        0 8px 30px rgba(0,0,0,.72);
    }
    .display[data-effect="urge"] .display-text { animation: urgeShake .42s ease-in-out 5; }
    .display[data-effect="win"] .display-text { animation: winPop .5s cubic-bezier(.16,1.5,.35,1); }
    .display[data-effect="sad"] .display-text { animation: sadDrop .9s ease-out both; color: #e5e7ec; }

    .back-hitbox {
      position: absolute;
      right: calc(var(--safe-right) + 6px);
      bottom: calc(var(--safe-bottom) + 6px);
      width: 48px;
      height: 48px;
      border: 0;
      background: transparent;
      padding: 0;
      z-index: 30;
    }
    .back-chip {
      position: absolute;
      right: 5px;
      bottom: 5px;
      min-width: 30px;
      height: 27px;
      padding: 0 7px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      background: rgba(0,0,0,.27);
      color: rgba(255,255,255,.42);
      font-size: 11px;
      font-weight: 800;
      backdrop-filter: blur(6px);
    }

    .confetti-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
    .confetti {
      position: absolute;
      top: -12vh;
      left: var(--x);
      width: var(--w);
      height: calc(var(--w) * 1.7);
      border-radius: 2px;
      background: var(--c);
      opacity: 0;
      transform: rotate(var(--r));
      animation: confettiFall var(--d) var(--delay) cubic-bezier(.18,.67,.42,1) forwards;
    }

    /* 編集ダイアログ */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,.72);
      display: flex;
      align-items: flex-end;
      padding: 12px 12px calc(var(--safe-bottom) + 12px);
      backdrop-filter: blur(6px);
    }
    .sheet {
      width: min(100%, 560px);
      margin: 0 auto;
      border-radius: 22px;
      background: #1a1a20;
      border: 1px solid rgba(255,255,255,.12);
      padding: 16px;
      max-height: calc(100dvh - var(--safe-top) - 24px);
      overflow-y: auto;
    }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .sheet h2 { margin: 0; font-size: 19px; }
    .close-x { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: #292932; font-size: 20px; }
    .field { display: grid; gap: 7px; margin-top: 14px; }
    .field span { color: #d6d6de; font-size: 13px; font-weight: 800; }
    .field input, .field textarea, .field select {
      width: 100%;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 13px;
      background: #0e0e12;
      color: #fff;
      padding: 12px;
      outline: none;
    }
    .field textarea { min-height: 116px; resize: vertical; line-height: 1.55; }
    .counter { text-align: right; color: var(--muted); font-size: 12px; }
    .save-button {
      width: 100%;
      min-height: 49px;
      margin-top: 16px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #181300;
      font-weight: 1000;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 16px;
    }

    @media (min-width: 720px) {
      .picker { max-width: 720px; margin: 0 auto; }
      .message-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 340px) {
      .message-grid { gap: 7px; }
      .message-button { min-height: 78px; font-size: 14px; padding-inline: 7px; }
      .tab { font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }

    @keyframes heatPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.6); } }
    @keyframes urgeShake { 0%,100% { transform: translateX(0) scale(1); } 25% { transform: translateX(-1.5vw) scale(1.02); } 75% { transform: translateX(1.5vw) scale(1.02); } }
    @keyframes winPop { from { transform: scale(.62); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes sadDrop { from { transform: translateY(-18px); opacity: 0; } to { transform: translateY(12px); opacity: 1; } }
    @keyframes confettiFall {
      0% { opacity: 0; transform: translate3d(0,-6vh,0) rotate(var(--r)); }
      8% { opacity: 1; }
      100% { opacity: 0; transform: translate3d(var(--drift),118vh,0) rotate(calc(var(--r) + 760deg)); }
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <main id="picker" class="picker">
      <header class="topbar">
        <div class="brand">
          <h1>無言メッセージボード</h1>
          <p>押した文を画面いっぱいに表示</p>
        </div>
        <button id="editToggle" class="quiet-button" type="button" aria-pressed="false">編集</button>
      </header>

      <div class="notice"><span aria-hidden="true">🔇</span><span><strong>声が出ない時用</strong>・文字は自動で画面内に収めます</span></div>

      <nav class="tabs" aria-label="メッセージ分類">
        <button class="tab active" type="button" data-tab="all">全部</button>
        <button class="tab" type="button" data-tab="thanks">感謝</button>
        <button class="tab" type="button" data-tab="gamble">勝負</button>
        <button class="tab" type="button" data-tab="visit">来店</button>
      </nav>

      <section id="messageGrid" class="message-grid" aria-live="polite"></section>
      <button id="addButton" class="add-button" type="button">＋ 自分のセリフを追加</button>
    </main>

    <section id="display" class="display" hidden aria-label="メッセージ表示画面" data-effect="none">
      <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>
      <div id="messageStage" class="message-stage">
        <div id="displayText" class="display-text"></div>
      </div>
      <button id="backButton" class="back-hitbox" type="button" aria-label="メッセージ選択に戻る"><span class="back-chip">選ぶ</span></button>
    </section>

    <div id="modal" class="modal" hidden>
      <form id="messageForm" class="sheet">
        <div class="sheet-head">
          <h2 id="formTitle">セリフを追加</h2>
          <button id="closeModal" class="close-x" type="button" aria-label="閉じる">×</button>
        </div>

        <label class="field">
          <span>ボタンに表示する短い名前</span>
          <input id="labelInput" maxlength="30" placeholder="例：ナイス！" autocomplete="off">
        </label>

        <label class="field">
          <span>視聴者に見せるメッセージ</span>
          <textarea id="textInput" maxlength="160" required placeholder="画面いっぱいに表示する文章"></textarea>
          <span id="charCounter" class="counter">0 / 160</span>
        </label>

        <label class="field">
          <span>分類</span>
          <select id="categoryInput">
            <option value="thanks">感謝</option>
            <option value="gamble">勝負</option>
            <option value="visit">来店</option>
          </select>
        </label>

        <label class="field">
          <span>演出</span>
          <select id="effectInput">
            <option value="none">なし</option>
            <option value="celebrate">紙吹雪</option>
            <option value="heat">熱い</option>
            <option value="urge">こいこい</option>
            <option value="win">大当たり</option>
            <option value="sad">絶望</option>
          </select>
        </label>

        <button class="save-button" type="submit">保存する</button>
      </form>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'teenda-silent-board.custom.v1';
      const defaults = [
        { id:'voice', label:'声が出ません', text:'声が出ません', category:'thanks', effect:'none' },
        { id:'watching', label:'コメント見ています', text:'コメントは\n見ています', category:'thanks', effect:'none' },
        { id:'superchat', label:'ナイスパ！', text:'ナイスパ！\nありがとうございます！', category:'thanks', effect:'celebrate' },
        { id:'gift', label:'ナイギフ！', text:'ナイギフ！\nありがとうございます！', category:'thanks', effect:'celebrate' },
        { id:'thanks', label:'ありがとうございます！', text:'ありがとうございます！', category:'thanks', effect:'celebrate' },
        { id:'congrats', label:'おめでとうございます！', text:'おめでとうございます！', category:'thanks', effect:'celebrate' },
        { id:'achieved', label:'祝！達成！', text:'祝！達成！', category:'thanks', effect:'win' },

        { id:'come', label:'こいこいこいこい！', text:'こいこいこいこい！', category:'gamble', effect:'urge' },
        { id:'hot', label:'熱い！！', text:'熱い！！', category:'gamble', effect:'heat' },
        { id:'please', label:'頼む！！', text:'頼む！！', category:'gamble', effect:'urge' },
        { id:'still', label:'まだある！！', text:'まだある！！', category:'gamble', effect:'urge' },
        { id:'possible', label:'これはある！！', text:'これはある！！', category:'gamble', effect:'heat' },
        { id:'go', label:'いける！！', text:'いける！！', category:'gamble', effect:'heat' },
        { id:'dont-end', label:'終わるな！！', text:'終わるな！！', category:'gamble', effect:'urge' },
        { id:'here', label:'ここや！！', text:'ここや！！', category:'gamble', effect:'heat' },
        { id:'came', label:'きた！！', text:'きた！！', category:'gamble', effect:'win' },
        { id:'yes', label:'やった！！', text:'やった！！', category:'gamble', effect:'win' },
        { id:'great', label:'よっしゃ！！', text:'よっしゃ！！', category:'gamble', effect:'win' },
        { id:'impossible', label:'これは無理です', text:'これは無理です', category:'gamble', effect:'sad' },
        { id:'over', label:'終わった……', text:'終わった……', category:'gamble', effect:'sad' },
        { id:'no', label:'ないないない！', text:'ないないない！', category:'gamble', effect:'sad' },
        { id:'expected', label:'でしょうねぇ！', text:'でしょうねぇ！', category:'gamble', effect:'sad' },
        { id:'why', label:'なんでやねん！', text:'なんでやねん！', category:'gamble', effect:'heat' },

        { id:'sticker', label:'シールいりますか？', text:'シールいりますか？', category:'visit', effect:'none' },
        { id:'gift-no', label:'差し入れについて', text:'ごめんなさい。\n差し入れはいただけません。\nお気持ちだけで感謝です。', category:'visit', effect:'none' }
      ];

      const app = document.getElementById('app');
      const picker = document.getElementById('picker');
      const grid = document.getElementById('messageGrid');
      const display = document.getElementById('display');
      const stage = document.getElementById('messageStage');
      const displayText = document.getElementById('displayText');
      const confettiLayer = document.getElementById('confettiLayer');
      const backButton = document.getElementById('backButton');
      const editToggle = document.getElementById('editToggle');
      const addButton = document.getElementById('addButton');
      const modal = document.getElementById('modal');
      const closeModal = document.getElementById('closeModal');
      const form = document.getElementById('messageForm');
      const formTitle = document.getElementById('formTitle');
      const labelInput = document.getElementById('labelInput');
      const textInput = document.getElementById('textInput');
      const categoryInput = document.getElementById('categoryInput');
      const effectInput = document.getElementById('effectInput');
      const charCounter = document.getElementById('charCounter');

      let currentTab = 'all';
      let editing = false;
      let editingId = null;
      let customMessages = loadCustom();
      let resizeTimer = null;

      function loadCustom() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          return Array.isArray(parsed) ? parsed.filter(isValidMessage) : [];
        } catch (_) {
          return [];
        }
      }

      function isValidMessage(item) {
        return item && typeof item.id === 'string' && typeof item.text === 'string' && item.text.trim();
      }

      function saveCustom() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(customMessages)); } catch (_) {}
      }

      function allMessages() {
        return defaults.concat(customMessages.map(item => ({ ...item, custom: true })));
      }

      function render() {
        const messages = allMessages().filter(item => currentTab === 'all' || item.category === currentTab);
        app.classList.toggle('editing', editing);
        editToggle.setAttribute('aria-pressed', String(editing));
        editToggle.textContent = editing ? '完了' : '編集';
        grid.textContent = '';

        if (!messages.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'この分類にはまだセリフがありません';
          grid.appendChild(empty);
          return;
        }

        const fragment = document.createDocumentFragment();
        for (const item of messages) {
          const card = document.createElement('div');
          card.className = 'message-card' + (item.custom ? ' custom' : '');
          card.dataset.category = item.category;
          card.dataset.effect = item.effect || 'none';

          const button = document.createElement('button');
          button.className = 'message-button';
          button.type = 'button';
          button.textContent = item.label || item.text;
          button.addEventListener('click', () => {
            if (!editing) showMessage(item);
          });
          card.appendChild(button);

          if (item.custom) {
            const actions = document.createElement('div');
            actions.className = 'edit-actions';
            const edit = document.createElement('button');
            edit.type = 'button';
            edit.className = 'mini-action';
            edit.setAttribute('aria-label', '編集');
            edit.textContent = '✎';
            edit.addEventListener('click', () => openForm(item));
            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'mini-action delete';
            del.setAttribute('aria-label', '削除');
            del.textContent = '×';
            del.addEventListener('click', () => removeCustom(item.id));
            actions.append(edit, del);
            card.appendChild(actions);
          }
          fragment.appendChild(card);
        }
        grid.appendChild(fragment);
      }

      function showMessage(item) {
        display.dataset.effect = item.effect || 'none';
        displayText.textContent = item.text.trim();
        display.hidden = false;
        picker.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = 'hidden';
        stage.scrollTop = 0;
        confettiLayer.textContent = '';
        if (item.effect === 'celebrate' || item.effect === 'win') createConfetti(item.effect === 'win' ? 44 : 34);
        requestAnimationFrame(() => requestAnimationFrame(fitText));
      }

      function hideMessage() {
        display.hidden = true;
        picker.removeAttribute('aria-hidden');
        document.body.style.overflow = '';
        displayText.textContent = '';
        confettiLayer.textContent = '';
      }

      function fitText() {
        if (display.hidden || !displayText.textContent) return;

        // 毎回いったん中央配置へ戻してから測る。直前の長文表示の状態を引き継がない。
        stage.style.alignItems = 'center';
        displayText.style.margin = 'auto 0';
        displayText.style.width = '100%';

        const stageStyle = getComputedStyle(stage);
        const horizontalPadding = parseFloat(stageStyle.paddingLeft) + parseFloat(stageStyle.paddingRight);
        const verticalPadding = parseFloat(stageStyle.paddingTop) + parseFloat(stageStyle.paddingBottom);
        const availableWidth = Math.max(1, stage.clientWidth - horizontalPadding);
        const availableHeight = Math.max(1, stage.clientHeight - verticalPadding);

        // 文字が切れないことを最優先。余白を除いた実寸で最大フォントを二分探索する。
        const maxSize = Math.min(138, Math.max(52, Math.floor(availableWidth * 0.32)));
        const minSize = 18;
        const plainText = displayText.textContent;
        const charCount = plainText.replace(/\s/g, '').length;
        const explicitLines = plainText.split('\n').length;
        // 短文が一文字ずつ縦に並ぶほど巨大化しないよう、読みやすい行数にも上限を置く。
        const preferredMaxLines = charCount <= 60
          ? Math.max(explicitLines, Math.min(8, Math.ceil(charCount / 6)))
          : Infinity;

        let low = minSize;
        let high = maxSize;
        let best = minSize;

        while (low <= high) {
          const mid = Math.floor((low + high) / 2);
          displayText.style.fontSize = mid + 'px';
          const computed = getComputedStyle(displayText);
          const lineHeight = parseFloat(computed.lineHeight) || mid * 1.14;
          const lineCount = Math.ceil((displayText.scrollHeight - 1) / lineHeight);
          const fitsWidth = displayText.scrollWidth <= availableWidth + 1;
          const fitsHeight = displayText.scrollHeight <= availableHeight + 1;
          const readableLines = lineCount <= preferredMaxLines;

          if (fitsWidth && fitsHeight && readableLines) {
            best = mid;
            low = mid + 1;
          } else {
            high = mid - 1;
          }
        }

        displayText.style.fontSize = best + 'px';

        // 任意文の大量改行など、最小サイズでも入らない場合だけスクロールへ逃がす。
        // overflow:hidden や省略記号は使わず、最後の一文字まで必ず到達できる。
        const stillTall = displayText.scrollHeight > availableHeight + 1;
        stage.style.alignItems = stillTall ? 'flex-start' : 'center';
        displayText.style.margin = stillTall ? '0' : 'auto 0';
      }

      function createConfetti(count) {
        const colors = ['#ffd23f','#ff5d73','#35d0ba','#ffffff','#ff8b22','#72a7ff'];
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < count; i++) {
          const bit = document.createElement('i');
          bit.className = 'confetti';
          bit.style.setProperty('--x', (Math.random() * 100).toFixed(2) + '%');
          bit.style.setProperty('--w', (5 + Math.random() * 7).toFixed(1) + 'px');
          bit.style.setProperty('--c', colors[i % colors.length]);
          bit.style.setProperty('--r', Math.floor(Math.random() * 360) + 'deg');
          bit.style.setProperty('--d', (2.2 + Math.random() * 1.7).toFixed(2) + 's');
          bit.style.setProperty('--delay', (Math.random() * .55).toFixed(2) + 's');
          bit.style.setProperty('--drift', (-60 + Math.random() * 120).toFixed(0) + 'px');
          fragment.appendChild(bit);
        }
        confettiLayer.appendChild(fragment);
        window.setTimeout(() => { confettiLayer.textContent = ''; }, 4700);
      }

      function openForm(item = null) {
        editingId = item ? item.id : null;
        formTitle.textContent = item ? 'セリフを編集' : 'セリフを追加';
        labelInput.value = item ? (item.label || '') : '';
        textInput.value = item ? item.text : '';
        categoryInput.value = item ? item.category : (currentTab === 'all' ? 'gamble' : currentTab);
        effectInput.value = item ? (item.effect || 'none') : 'none';
        updateCount();
        modal.hidden = false;
        document.body.style.overflow = 'hidden';
        window.setTimeout(() => textInput.focus(), 60);
      }

      function closeForm() {
        modal.hidden = true;
        editingId = null;
        form.reset();
        document.body.style.overflow = '';
      }

      function removeCustom(id) {
        const target = customMessages.find(item => item.id === id);
        if (!target) return;
        if (!window.confirm('「' + (target.label || target.text) + '」を削除しますか？')) return;
        customMessages = customMessages.filter(item => item.id !== id);
        saveCustom();
        render();
      }

      function updateCount() {
        charCounter.textContent = textInput.value.length + ' / 160';
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        const text = textInput.value.trim();
        if (!text) return;
        const label = labelInput.value.trim() || text.replace(/\s+/g, ' ').slice(0, 30);
        const item = {
          id: editingId || ('custom-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,7)),
          label,
          text,
          category: categoryInput.value,
          effect: effectInput.value
        };

        if (editingId) {
          customMessages = customMessages.map(existing => existing.id === editingId ? item : existing);
        } else {
          customMessages.push(item);
        }
        saveCustom();
        closeForm();
        render();
      });

      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          currentTab = tab.dataset.tab;
          document.querySelectorAll('.tab').forEach(btn => btn.classList.toggle('active', btn === tab));
          render();
        });
      });

      editToggle.addEventListener('click', () => { editing = !editing; render(); });
      addButton.addEventListener('click', () => openForm());
      closeModal.addEventListener('click', closeForm);
      modal.addEventListener('click', event => { if (event.target === modal) closeForm(); });
      textInput.addEventListener('input', updateCount);
      backButton.addEventListener('click', hideMessage);
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          if (!modal.hidden) closeForm();
          else if (!display.hidden) hideMessage();
        }
      });

      const refit = () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(fitText, 80);
      };
      window.addEventListener('resize', refit, { passive: true });
      window.visualViewport?.addEventListener('resize', refit, { passive: true });
      new ResizeObserver(refit).observe(stage);

      try { navigator.storage?.persist?.(); } catch (_) {}
      render();
    })();
  </script>
</body>
</html>
