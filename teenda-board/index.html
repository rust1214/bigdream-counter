<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>てえんだ 無言メッセージボード</title>
  <link rel="stylesheet" href="style.css?v=20260805-2">
</head>
<body>
  <div id="app" class="app">
    <main id="picker" class="picker">
      <header class="topbar">
        <div class="brand"><h1>無言メッセージボード</h1><p>押した文を画面いっぱいに表示</p></div>
        <button id="editToggle" class="quiet-button" type="button" aria-pressed="false">編集</button>
      </header>
      <div class="notice"><span aria-hidden="true">🔇</span><span><strong>声が出ない時用</strong>・文字は自動で画面内に収めます</span></div>
      <button id="instantButton" class="instant-button" type="button">自由メッセージを一回だけ表示<small>登録・保存はしません</small></button>
      <nav class="tabs" aria-label="メッセージ分類">
        <button class="tab active" type="button" data-tab="all">全部</button>
        <button class="tab" type="button" data-tab="thanks">感謝</button>
        <button class="tab" type="button" data-tab="gamble">勝負</button>
        <button class="tab" type="button" data-tab="visit">来店</button>
      </nav>
      <section id="messageGrid" class="message-grid" aria-live="polite"></section>
      <button id="addButton" class="add-button" type="button">＋ 自分のセリフを追加</button>
    </main>

    <section id="display" class="display" hidden aria-label="メッセージ表示画面" data-effect="none">
      <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>
      <div id="messageStage" class="message-stage"><div id="displayText" class="display-text"></div></div>
      <button id="backButton" class="back-hitbox" type="button" aria-label="メッセージ選択に戻る"><span class="back-chip">選ぶ</span></button>
    </section>

    <div id="modal" class="modal" hidden>
      <form id="messageForm" class="sheet">
        <div class="sheet-head"><h2 id="formTitle">セリフを追加</h2><button id="closeModal" class="close-x" type="button" aria-label="閉じる">×</button></div>
        <label id="labelField" class="field"><span>ボタンに表示する短い名前</span><input id="labelInput" maxlength="30" placeholder="例：ナイス！" autocomplete="off"></label>
        <label class="field"><span id="textFieldTitle">視聴者に見せるメッセージ</span><textarea id="textInput" maxlength="160" required placeholder="画面いっぱいに表示する文章"></textarea><span id="charCounter" class="counter">0 / 160</span></label>
        <label id="categoryField" class="field"><span>分類</span><select id="categoryInput"><option value="thanks">感謝</option><option value="gamble">勝負</option><option value="visit">来店</option></select></label>
        <label id="effectField" class="field"><span>演出</span><select id="effectInput"><option value="none">なし</option><option value="celebrate">紙吹雪</option><option value="heat">熱い</option><option value="urge">こいこい</option><option value="win">大当たり</option><option value="sad">絶望</option></select></label>
        <button id="formSubmit" class="save-button" type="submit">保存する</button>
      </form>
    </div>
  </div>
  <script src="defaults.js?v=20260805-2"></script>
  <script src="app.js?v=20260805-2"></script>
</body>
</html>
